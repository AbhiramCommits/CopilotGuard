spring:
  application:
    name: copilotguard
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/copilotguard}
    username: ${POSTGRES_USER:copilotguard}
    password: ${POSTGRES_PASSWORD:copilotguard}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/copilotguard}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

copilotguard:
  anthropic-api-key: ${ANTHROPIC_API_KEY:}
  anthropic:
    base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
    model: ${ANTHROPIC_MODEL:claude-sonnet-4-20250514}
    version: ${ANTHROPIC_VERSION:2023-06-01}
    max-tokens: 8192
    max-attempts: 4
    timeout: 60s
    prices:
      default:
        input-per-mtok: 3.0
        output-per-mtok: 15.0
  github:
    base-url: ${GITHUB_API_URL:https://api.github.com}
    raw-base-url: ${GITHUB_RAW_URL:https://raw.githubusercontent.com}
    token: ${GITHUB_TOKEN:}
  validation:
    image: ${VALIDATION_IMAGE:eclipse-temurin:21-jdk}
    compile-timeout: 120s
    run-timeout: 120s
    memory-mb: 512
    cpus: 1.0
    junit-console-jar: /opt/copilotguard/junit-console-standalone.jar
