services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: copilotguard
      POSTGRES_USER: copilotguard
      POSTGRES_PASSWORD: copilotguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilotguard -d copilotguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  service:
    build:
      context: ./service
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/copilotguard
      POSTGRES_USER: copilotguard
      POSTGRES_PASSWORD: copilotguard
      MONGO_URI: mongodb://mongo:27017/copilotguard
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy

volumes:
  postgres_data:
  mongo_data:
